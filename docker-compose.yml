services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_dev_password
      POSTGRES_DB: ledger_agent
    ports:
      - "5432:5432"
    volumes:
      - ledger_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ledger_pg_data:
